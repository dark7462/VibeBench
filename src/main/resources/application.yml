server:
  port: 8080

spring:
  application:
    name: VibeBench
  
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/vibebench}
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25
      thread-name-prefix: vibebench-async-
